name: Bug report
description: Something does not work as described in the documentation.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Never paste your OVHcloud application secret or consumer key: the logs of the integration do not contain them, but check before posting. Phone numbers are masked in the logs.
  - type: input
    id: gladys-version
    attributes:
      label: Gladys version
      description: Settings → System.
      placeholder: '5.1.1'
    validations:
      required: true
  - type: input
    id: integration-version
    attributes:
      label: Integration version
      description: Integrations → OVHcloud SMS → Supervision tab.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: account
    attributes:
      label: OVHcloud SMS account
      description: The API region (Europe or Canada) and the kind of sender used (alphanumeric name, virtual number, short number for replies), as shown by "Test the connection". Never the service name or keys.
      placeholder: 'Europe, alphanumeric sender, reception enabled'
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Logs of the integration (Settings → Supervision). In developer mode, add the environment variable `DEBUG=gladys-integration-sdk` for the SDK debug logs, reproduce, then copy the lines. Phone numbers are masked; hide the texts of the SMS if you wish.
      render: text
